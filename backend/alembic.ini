# Alembic settings. The app runs migrations itself on start (accountable.migrate),
# so this file is only for running Alembic by hand, from backend/:
#   uv run alembic -c alembic.ini upgrade head
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
