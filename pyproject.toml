[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM for one salesperson, running locally"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.17.5",
    "ty>=0.0.105",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
# The defaults, plus import order and a limit on how complex any one function may get.
extend-select = ["I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["backend"]

[tool.coverage.run]
source = ["backend/accountable"]
omit = ["backend/migrations/*"]
